services:
  api:
    build: ./backend
    environment:
      EF_DATA_ROOT: /data
    volumes:
      - ./data/sample:/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 3s
      retries: 3
  frontend:
    image: node:22.14.0-alpine3.21
    working_dir: /app
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm exec vite --host 0.0.0.0 --mode docker"
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
